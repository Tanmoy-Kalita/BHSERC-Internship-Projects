<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Clipper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fff;
      color: #1f2937;
    }
    .header {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: white;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-icon { font-size: 24px; }
    .header-title { font-weight: 600; font-size: 16px; }
    .header-subtitle { font-size: 11px; opacity: 0.9; }

    .content { padding: 16px; }
    .section { margin-bottom: 20px; }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #6b7280;
      margin-bottom: 12px;
    }

    .job-preview {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .job-preview-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
    .job-preview-meta { font-size: 12px; color: #64748b; display: flex; flex-wrap: wrap; gap: 12px; }
    .job-preview-meta span { display: flex; align-items: center; gap: 4px; }

    .confidence-badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
    }
    .confidence-high { background: #dcfce7; color: #166534; }
    .confidence-medium { background: #fef3c7; color: #92400e; }
    .confidence-low { background: #fee2e2; color: #991b1b; }

    .btn {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #f1f5f9; color: #334155; }
    .btn-secondary:hover { background: #e2e8f0; }
    .btn-success { background: #059669; color: white; }
    .btn-success:hover { background: #047857; }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 8px;
    }
    .stat-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .stat-value { font-size: 18px; font-weight: 700; color: #2563eb; }
    .stat-label { font-size: 10px; color: #64748b; text-transform: uppercase; }

    .divider { height: 1px; background: #e2e8f0; margin: 16px 0; }

    .footer {
      padding: 12px 16px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer-link { font-size: 11px; color: #2563eb; text-decoration: none; }
    .version { font-size: 10px; color: #94a3b8; }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #64748b;
    }
    .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-icon">📋</span>
    <div>
      <div class="header-title">Job Clipper</div>
      <div class="header-subtitle" id="statusText">Loading...</div>
    </div>
  </div>

  <div class="content">
    <div id="jobPreview" style="display: none;">
      <div class="job-preview">
        <div class="job-preview-title" id="previewTitle"></div>
        <div class="job-preview-meta" id="previewMeta"></div>
        <div style="margin-top: 8px;">
          <span class="confidence-badge" id="previewConfidence"></span>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Actions</div>
      <button class="btn btn-primary" id="btnClip" onclick="clipJob()">📋 Clip This Job</button>
      <button class="btn btn-secondary" style="margin-top: 8px;" id="btnOpenBoard" onclick="openBoard()">📊 Open Job Board</button>
    </div>

    <div class="divider"></div>

    <div class="section">
      <div class="section-title">Quick Stats</div>
      <div class="stats-row">
        <div class="stat-box"><div class="stat-value" id="statSaved">0</div><div class="stat-label">Saved</div></div>
        <div class="stat-box"><div class="stat-value" id="statApplied">0</div><div class="stat-label">Applied</div></div>
        <div class="stat-box"><div class="stat-value" id="statInterview">0</div><div class="stat-label">Interview</div></div>
        <div class="stat-box"><div class="stat-value" id="statOffer">0</div><div class="stat-label">Offers</div></div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="section">
      <button class="btn btn-success" onclick="exportCSV()">📊 Export to CSV</button>
      <button class="btn btn-secondary" style="margin-top: 8px;" onclick="importCSV()">📥 Import CSV</button>
    </div>
  </div>

  <div class="footer">
    <a class="footer-link" href="#" onclick="openShortcuts(); return false;">Shortcuts</a>
    <span class="version" id="versionText">v1.0.0</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
