<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Same Page New Design</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 1rem;
      width: 320px;
      background: #0b0f19;
      color: #f8fafc;
    }
    h2 {
      font-size: 1.1rem;
      color: #6366f1;
      margin-bottom: 0.25rem;
    }
    .sub {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 1rem;
    }
    .card {
      background: #172036;
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 8px;
      padding: 0.75rem;
      margin-bottom: 0.75rem;
      font-size: 0.8rem;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 0.6rem;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      box-sizing: border-box;
      cursor: pointer;
    }
    .btn:hover { background: #4f46e5; }
  </style>
</head>
<body>
  <h2>🎨 Same Page, New Design</h2>
  <div class="sub">Side-by-side design transformation comparison</div>
  <div class="card">
    <div style="font-weight: bold; color: #a5b4fc; margin-bottom: 0.25rem;">Status Checklist:</div>
    <div>✓ before.html (un-styled raw HTML)</div>
    <div>✓ after.html (mobile-ready design)</div>
    <div>✓ 96/96 words verified identical</div>
    <div>✓ 3 design rationale notes documented</div>
  </div>
  <a href="index.html" target="_blank" class="btn">Launch Comparison Studio</a>
</body>
</html>
