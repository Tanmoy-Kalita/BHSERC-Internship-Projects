<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One-Minute Reel Cut</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 1rem;
      width: 360px;
      background: #0f172a;
      color: #f8fafc;
    }
    h2 {
      font-size: 1.1rem;
      margin-bottom: 0.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .sub {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 1rem;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 0.85rem;
      margin-bottom: 0.75rem;
    }
    .card-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #38bdf8;
      margin-bottom: 0.5rem;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 0.6rem;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      box-sizing: border-box;
      margin-bottom: 0.5rem;
    }
    .btn:hover { background: #dc2626; }
    .btn-secondary {
      background: #334155;
      color: #f8fafc;
    }
    .btn-secondary:hover { background: #475569; }
    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      padding: 0.25rem 0;
      border-bottom: 1px solid #334155;
    }
    .stat-row:last-child { border: none; }
  </style>
</head>
<body>
  <h2>✂️ One-Minute Reel Cut</h2>
  <div class="sub">Turn raw 5-minute videos into 60-second vertical reels</div>

  <div class="card">
    <div class="card-title">⚡ Quick Reel Status</div>
    <div class="stat-row">
      <span>Auto-Cuts (silence/filler):</span>
      <span style="color: #22c55e; font-weight: bold;">8 detected</span>
    </div>
    <div class="stat-row">
      <span>Target Aspect:</span>
      <span style="font-weight: bold;">9:16 Portrait</span>
    </div>
    <div class="stat-row">
      <span>Max Reel Length:</span>
      <span style="color: #facc15; font-weight: bold;">≤ 60 seconds</span>
    </div>
  </div>

  <a href="index.html" target="_blank" class="btn">🚀 Open Full Reel Studio</a>
  <button id="btnQuickSelect" class="btn btn-secondary">📁 Select Local Video</button>
  <div id="quickStatus" style="font-size: 0.75rem; color: #94a3b8; text-align: center; margin-top: 0.5rem;"></div>

  <script src="popup.js"></script>
</body>
</html>
