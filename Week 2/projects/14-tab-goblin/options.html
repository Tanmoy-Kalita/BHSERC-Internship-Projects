<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Goblin - Options</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; line-height: 1.6; }
    h1 { color: #6366f1; }
    .setting-group { margin-bottom: 20px; background: #f9fafb; padding: 15px; border-radius: 8px; border: 1px solid #e5e7eb; }
    label { display: block; font-weight: 600; margin-bottom: 5px; }
  </style>
</head>
<body>
  <h1>Tab Goblin Settings</h1>
  <div class="setting-group">
    <label><input type="checkbox" id="autoSuspend" checked> Auto-suspend inactive tabs after 30 mins</label>
  </div>
  <div class="setting-group">
    <label><input type="checkbox" id="discardOnSuspend" checked> Use native Chrome memory saver where available</label>
  </div>
</body>
</html>
