<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Style Spy - Side Panel</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="sidepanel-container">
    <header class="sidepanel-header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
        </svg>
        <span>Style Spy</span>
      </div>
      <button id="btnClose" class="btn-icon" title="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </header>

    <div class="toolbar">
      <button id="btnActivate" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
        </svg>
        Activate Inspector
      </button>
      <button id="btnExtractAll" class="btn btn-secondary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        Extract Page Styles
      </button>
    </div>

    <div class="divider"></div>

    <section class="section">
      <h3>Color Palette</h3>
      <div class="color-grid" id="colorGrid">
        <div class="empty-state">Activate inspector to extract colors</div>
      </div>
    </section>

    <div class="divider"></div>

    <section class="section">
      <h3>Typography</h3>
      <div class="typography-list" id="typographyList">
        <div class="empty-state">Activate inspector to extract fonts</div>
      </div>
    </section>

    <div class="divider"></div>

    <section class="section">
      <h3>Spacing Scale</h3>
      <div class="spacing-list" id="spacingList">
        <div class="empty-state">Activate inspector to extract spacing</div>
      </div>
    </section>

    <div class="divider"></div>

    <section class="section">
      <h3>Shadows</h3>
      <div class="shadow-list" id="shadowList">
        <div class="empty-state">Activate inspector to extract shadows</div>
      </div>
    </section>

    <div class="divider"></div>

    <footer class="sidepanel-footer">
      <button id="btnExportDesign" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        Export Design System
      </button>
    </footer>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
